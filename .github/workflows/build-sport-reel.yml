name: Build and host reviewed ADVANCE sport Reel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sport-reel.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-sport-reel-build
  cancel-in-progress: false
jobs:
  build-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow>=11,<13'
      - name: Render and verify exact reviewed QA bytes
        run: |
          set -euo pipefail
          mkdir -p videos/MEDIA-CAREER
          python tools/render_graphic_reel.py --recipe recipes/R-20261103-SPORT-EXPERIENCE.json --output build/sport.mp4
          echo "682fd98715d5c9a135290226aede794bcf8838532456030b46fe258efa52a5da  build/sport.mp4" | sha256sum -c -
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,pix_fmt -of json build/sport.mp4
          cp build/sport.mp4 videos/MEDIA-CAREER/ADVANCE_sport_experience_16s.mp4
      - name: Commit immutable media asset (no Instagram posting)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/MEDIA-CAREER/ADVANCE_sport_experience_16s.mp4
          if git diff --cached --quiet; then
            echo 'Identical media already hosted; no commit needed'
          else
            git commit -m 'media: host QA-verified ADVANCE sport Reel (no publication)'
            git push origin HEAD:main
          fi
          echo "MEDIA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Video SHA256: 682fd98715d5c9a135290226aede794bcf8838532456030b46fe258efa52a5da" >> "$GITHUB_STEP_SUMMARY"
          echo "Instagram publishing is not performed by this workflow." >> "$GITHUB_STEP_SUMMARY"
